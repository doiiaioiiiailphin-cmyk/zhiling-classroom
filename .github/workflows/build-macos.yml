name: Build macOS Desktop App

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target Mac architecture
        type: choice
        options: [arm64, x86_64]
        default: arm64
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: ${{ inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend test dependencies
        run: python3 -m pip install -r backend/requirements-runtime.txt

      - name: Run frontend typecheck & backend unit tests
        run: |
          npm run typecheck
          python3 -X utf8 -m unittest discover -s backend/tests -v

      - name: Build ZhilingClassroom.app and .dmg
        run: bash scripts/build_macos.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhilingClassroom-macOS-${{ runner.arch == 'X64' && 'x86_64' || 'arm64' }}
          path: release/ZhilingClassroom-macOS-*.dmg
          retention-days: 14

      - name: Sync macOS DMG to CNB Release (when CNB_TOKEN is configured)
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: |
          if [[ -z "${CNB_TOKEN:-}" || -z "${CNB_REPO:-}" ]]; then
            echo "CNB_TOKEN 或 CNB_REPO 未在 GitHub Secrets/Variables 中配置，跳过自动同步 CNB。"
            exit 0
          fi
          APP_VER="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && -n "${GITHUB_REF_NAME:-}" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${APP_VER}"
          fi
          python3 scripts/publish_cnb_release.py \
            --repo "${CNB_REPO}" \
            --tag "${TAG_NAME}" \
            --title "知聆课堂 ${TAG_NAME}" \
            release/ZhilingClassroom-macOS-*.dmg
